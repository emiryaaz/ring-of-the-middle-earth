<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ring of the Middle Earth</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      color: #7dd3fc;
    }

<div class="map">
  <div class="region" id="region-bree">
    <h3>Bree</h3>
    <div class="units"></div>
  </div>

  <div class="path">───</div>

  <div class="region" id="region-rivendell">
    <h3>Rivendell</h3>
    <div class="units"></div>
  </div>

  <div class="path">───</div>

  <div class="region" id="region-moria">
    <h3>Moria</h3>
    <div class="units"></div>
  </div>
</div>

    .container {
      display: flex;
      gap: 20px;
    }

    .panel {
      flex: 1;
      border: 1px solid #444;
      padding: 16px;
      border-radius: 8px;
      background: #1a1a1a;
    }

    input,
    textarea,
    button {
      width: 100%;
      margin-top: 8px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      border: none;
      box-sizing: border-box;
    }

    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .events {
      height: 400px;
      overflow-y: auto;
      background: #000;
      padding: 8px;
      font-family: monospace;
      font-size: 13px;
    }

    .event {
      border-bottom: 1px solid #333;
      padding: 6px 0;
    }
  </style>
</head>

<body>

  <h1>Ring of the Middle Earth</h1>

  <div class="container">

    <div class="panel">
      <h2>Light Side</h2>

      <input id="lightUnitId" placeholder="unitId" value="test-unit-5" />
      <input id="lightOrderType" placeholder="orderType" value="ASSIGN_ROUTE" />
      <textarea id="lightPayload">{"pathIds":["bree-to-rivendell"]}</textarea>

      <button onclick="sendOrder('light')">Send Light Order</button>

      <h3>Light Events</h3>
      <div id="lightEvents" class="events"></div>
    </div>

    <div class="panel">
      <h2>Dark Side</h2>

      <input id="darkUnitId" placeholder="unitId" value="witch-king" />
      <input id="darkOrderType" placeholder="orderType" value="BLOCK_PATH" />
      <textarea id="darkPayload">{"pathId":"bree-to-rivendell"}</textarea>

      <button onclick="sendOrder('dark')">Send Dark Order</button>

      <h3>Dark Events</h3>
      <div id="darkEvents" class="events"></div>
    </div>

  </div>

  <script src="game.js"></script>

</body>

</html>
